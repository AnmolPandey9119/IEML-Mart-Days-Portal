<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title id="pageTitleTag">Admin Portal</title>
<link rel="icon" type="image/png" href="/assets/ieml-logo.png" />
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>

<div class="sidebar-overlay" id="sidebarOverlay"></div>

<div class="app-shell">
  <!-- LEFT IDENTITY RAIL — same visual language as the e-badge download
       platform's .identity panel (dot grid, gate-photo + brand gradient,
       gold eyebrow, Fraunces gradient headline, pill chips, footer note
       pinned to the bottom) — with the section nav tabs arranged inside
       it. On small screens this becomes the hamburger drawer (same
       #sidebar / #sidebarCloseBtn ids as before). -->
  <aside class="sidebar" id="sidebar">
    <button class="sidebar-close-btn" id="sidebarCloseBtn" aria-label="Close"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 5l14 14"/><path d="M19 5L5 19"/></svg></button>

    <div class="identity-dots" aria-hidden="true"></div>

    <div class="identity-inner">
      <img src="/assets/ieml-logo.png" alt="India Exposition Mart Ltd. logo" class="identity-logo" onerror="this.style.display='none'" />

      <p class="identity-eyebrow">Optimum Sourcing Destination</p>
      <h2 class="identity-kicker">India Expo <span class="identity-kicker-accent">Centre &amp;</span> Mart</h2>

      <span class="identity-badge" id="brandEdition"></span>
      <h3 class="identity-subheading">Sourcing Days</h3>
      <p class="identity-tagline" id="brandTag"></p>

      <div class="identity-chips">
        <span class="chip chip-fill">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
          <span id="eventCardDates"></span>
        </span>
      </div>

      <p class="identity-venue">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-6.1 7-11.5A7 7 0 0 0 5 9.5C5 14.9 12 21 12 21Z"/><circle cx="12" cy="9.5" r="2.5"/></svg>
        <span id="eventCardVenue"></span>
      </p>

      <nav class="nav-list" id="navList">
        <button class="nav-item" data-view="overview"><span class="nav-icon"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11.5 12 4l8 7.5"/><path d="M6 10v9a1 1 0 0 0 1 1h3v-6h4v6h3a1 1 0 0 0 1-1v-9"/></svg></span> <span class="nav-label">Overview</span></button>
        <button class="nav-item" data-view="buyers"><span class="nav-icon"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 20v-1a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v1"/><circle cx="8" cy="8" r="3.2"/><path d="M15 5.2a3.2 3.2 0 0 1 0 6.2"/><path d="M22 20v-1a3.6 3.6 0 0 0-2.5-3.4"/></svg></span> <span class="nav-label">Buyers</span></button>
        <button class="nav-item" data-view="martOwners"><span class="nav-icon"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5 4.5 4h15L21 9.5"/><path d="M4 9.5V20h16V9.5"/><path d="M9 20v-6h6v6"/><path d="M3 9.5h18"/></svg></span> <span class="nav-label">Mart Owners</span></button>
        <button class="nav-item" data-view="analytics"><span class="nav-icon"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10"/><path d="M10 20V4"/><path d="M16 20v-7"/><path d="M4 20h16"/></svg></span> <span class="nav-label">Analytics</span></button>
        <button class="nav-item" data-view="printHistory"><span class="nav-icon"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9V3h12v6"/><rect x="4" y="9" width="16" height="8" rx="1.5"/><path d="M6 17v4h12v-4"/><circle cx="17.2" cy="12" r="0.9" fill="currentColor" stroke="none"/></svg></span> <span class="nav-label">Print History</span></button>
        <button class="nav-item nav-item-danger" data-view="dangerZone"><span class="nav-icon"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5 21.5 20h-19L12 3.5z"/><path d="M12 9.5v4.5"/><circle cx="12" cy="17" r="0.9" fill="currentColor" stroke="none"/></svg></span> <span class="nav-label">Danger Zone</span></button>
      </nav>

      <p class="identity-footer">Internal admin console · India Expo Centre &amp; Mart</p>
    </div>
  </aside>

  <main class="main">
    <div class="content-topbar">
      <button class="hamburger-btn" id="hamburgerBtn" aria-label="Open menu">
        <span></span><span></span><span></span>
      </button>

      <h1 id="pageTitle" class="content-title">Overview</h1>

      <div class="main-header-actions" id="headerActions"></div>

      <div class="topbar-avatar-wrap" id="avatarWrap">
        <button class="avatar-btn" id="avatarBtn" title="Account" aria-label="Account menu"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.6"/><path d="M4.5 20a7.5 7.5 0 0 1 15 0"/></svg></button>
        <div class="avatar-menu" id="avatarMenu">
          <button class="avatar-menu-item" id="homeMenuBtn"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11.5 12 4l8 7.5"/><path d="M6 10v9a1 1 0 0 0 1 1h3v-6h4v6h3a1 1 0 0 0 1-1v-9"/></svg> Home</button>
          <button class="avatar-menu-item" id="logoutMenuBtn"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg> Logout</button>
        </div>
      </div>
    </div>

    <div id="viewArea"></div>
  </main>
</div>

<div class="modal-backdrop" id="ownerModalBackdrop">
  <div class="modal-card">
    <h2 id="ownerModalTitle">Add Mart Owner</h2>
    <div id="ownerModalBody"></div>
    <div class="modal-error" id="ownerModalError"></div>
    <div class="modal-actions">
      <button class="btn" id="ownerModalCancel">Cancel</button>
      <button class="btn primary" id="ownerModalSave">Save</button>
    </div>
  </div>
</div>

<div class="modal-backdrop" id="visitorModalBackdrop">
  <div class="modal-card modal-card-wide">
    <h2 id="visitorModalTitle">Buyer Details</h2>
    <div id="visitorModalBody"></div>
    <div class="modal-error" id="visitorModalError"></div>
    <div class="modal-actions">
      <button class="btn" id="visitorModalCancel">Close</button>
      <button class="btn primary" id="visitorModalSave" style="display:none;">Save Changes</button>
    </div>
  </div>
</div>

<div class="modal-backdrop" id="bulkUploadModalBackdrop">
  <div class="modal-card modal-card-wide">
    <h2>Bulk Upload Buyers</h2>
    <div id="bulkUploadModalBody"></div>
    <div class="modal-error" id="bulkUploadModalError"></div>
    <div class="modal-actions">
      <button class="btn" id="bulkUploadModalCancel">Close</button>
      <button class="btn primary" id="bulkUploadModalSubmit" style="display:none;">Import</button>
    </div>
  </div>
</div>

<!-- Second-step "are you absolutely sure" popup for the Danger Zone.
     Only reachable after the admin has already typed the exact
     confirmation phrase on the Danger Zone page itself. -->
<div class="modal-backdrop" id="dangerConfirmModalBackdrop">
  <div class="modal-card">
    <h2 style="display:flex;align-items:center;gap:9px;"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:19px;height:19px;color:var(--error);"><path d="M12 3.5 21.5 20h-19L12 3.5z"/><path d="M12 9.5v4.5"/><circle cx="12" cy="17" r="0.9" fill="currentColor" stroke="none"/></svg> Final confirmation</h2>
    <p id="dangerConfirmMessage" style="font-size:14px;color:#45303d;line-height:1.5;"></p>
    <p style="font-size:13px;color:var(--error);font-weight:700;">This cannot be undone.</p>
    <div class="modal-error" id="dangerConfirmError"></div>
    <div class="modal-actions">
      <button class="btn" id="dangerConfirmCancel">Cancel</button>
      <button class="btn danger" id="dangerConfirmProceed">Yes, delete everything</button>
    </div>
  </div>
</div>

<script src="/js/vendor/chart.umd.min.js"></script>
<script src="/js/geo-data.js"></script>
<script src="/js/dashboard.js"></script>
</body>
</html>
