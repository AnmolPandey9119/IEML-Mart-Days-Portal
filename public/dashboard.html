<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title id="pageTitleTag">Admin Portal</title>
<link rel="icon" type="image/png" href="/assets/ieml-logo.png" />
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>

<div class="mobile-topbar">
  <button class="hamburger-btn" id="hamburgerBtn" aria-label="Open menu">
    <span></span><span></span><span></span>
  </button>
  <div class="mobile-topbar-title">
    <img src="/assets/ieml-logo.png" alt="" />
    <span>Sourcing Days</span>
  </div>
</div>

<div class="sidebar-overlay" id="sidebarOverlay"></div>

<div class="app-shell">
  <aside class="sidebar" id="sidebar">
    <button class="sidebar-close-btn" id="sidebarCloseBtn" aria-label="Close menu">✕</button>
    <div class="sidebar-brand">
      <div class="sidebar-brand-mark"><img src="/assets/ieml-logo.png" alt="India Exposition Mart Ltd. logo" /></div>
      <div class="sidebar-brand-org">India Exposition Mart Limited</div>
      <div class="sidebar-brand-edition" id="brandEdition"></div>
      <div class="sidebar-brand-title">Sourcing Days</div>
      <div class="sidebar-brand-tag" id="brandTag"></div>
      <div class="sidebar-brand-divider"></div>
      <div class="sidebar-brand-row">📅 <span id="eventCardDates"></span></div>
      <div class="sidebar-brand-row">📍 <span id="eventCardVenue"></span></div>
    </div>

    <nav class="nav-list" id="navList">
      <button class="nav-item" data-view="overview"><span class="nav-icon">🏠</span> Overview</button>
      <button class="nav-item" data-view="buyers"><span class="nav-icon">👥</span> Buyers</button>
      <button class="nav-item" data-view="martOwners"><span class="nav-icon">🏬</span> Mart Owners</button>
      <button class="nav-item" data-view="analytics"><span class="nav-icon">📊</span> Analytics</button>
      <button class="nav-item" data-view="printHistory"><span class="nav-icon">🖨️</span> Print History</button>
      <button class="nav-item nav-item-danger" data-view="dangerZone"><span class="nav-icon">⚠️</span> Danger Zone</button>
    </nav>
  </aside>

  <main class="main">
    <div class="main-header">
      <h1 id="pageTitle">Overview</h1>
      <div class="main-header-actions" id="headerActions"></div>
    </div>

    <div id="viewArea"></div>
  </main>
</div>

<div class="topbar-avatar-wrap" id="avatarWrap">
  <button class="avatar-btn" id="avatarBtn" title="Account" aria-label="Account menu">👤</button>
  <div class="avatar-menu" id="avatarMenu">
    <button class="avatar-menu-item" id="homeMenuBtn">🏠 Home</button>
    <button class="avatar-menu-item" id="logoutMenuBtn">🚪 Logout</button>
  </div>
</div>

<div class="modal-backdrop" id="ownerModalBackdrop">
  <div class="modal-card">
    <h2 id="ownerModalTitle">Add Mart Owner</h2>
    <div id="ownerModalBody"></div>
    <div class="modal-error" id="ownerModalError"></div>
    <div class="modal-actions">
      <button class="btn" id="ownerModalCancel">Cancel</button>
      <button class="btn primary" id="ownerModalSave">Save</button>
    </div>
  </div>
</div>

<div class="modal-backdrop" id="visitorModalBackdrop">
  <div class="modal-card modal-card-wide">
    <h2 id="visitorModalTitle">Buyer Details</h2>
    <div id="visitorModalBody"></div>
    <div class="modal-error" id="visitorModalError"></div>
    <div class="modal-actions">
      <button class="btn" id="visitorModalCancel">Close</button>
      <button class="btn primary" id="visitorModalSave" style="display:none;">Save Changes</button>
    </div>
  </div>
</div>

<!-- Second-step "are you absolutely sure" popup for the Danger Zone.
     Only reachable after the admin has already typed the exact
     confirmation phrase on the Danger Zone page itself. -->
<div class="modal-backdrop" id="dangerConfirmModalBackdrop">
  <div class="modal-card">
    <h2>⚠️ Final confirmation</h2>
    <p id="dangerConfirmMessage" style="font-size:14px;color:#45303d;line-height:1.5;"></p>
    <p style="font-size:13px;color:var(--error);font-weight:700;">This cannot be undone.</p>
    <div class="modal-error" id="dangerConfirmError"></div>
    <div class="modal-actions">
      <button class="btn" id="dangerConfirmCancel">Cancel</button>
      <button class="btn danger" id="dangerConfirmProceed">Yes, delete everything</button>
    </div>
  </div>
</div>

<script src="/js/vendor/chart.umd.min.js"></script>
<script src="/js/geo-data.js"></script>
<script src="/js/dashboard.js"></script>
</body>
</html>
